---
# tasks file for setup-apache-role
- name: install {{ rh_pkg }} package
  yum:
    name: "{{ rh_pkg }}"
    state: installed
  when: ansible_os_family == "RedHat"
  notify: start {{ rh_pkg }} service

- name: install {{ db_pkg }} package
  apt:
    name: "{{ db_pkg }}"
    state: present
  when: ansible_os_family == "Debian"
  notify: start {{ db_pkg }} service

- name: Ensure httpd is started and enabled
  service:
    name: "{{ rh_pkg }}"
    state: started
    enabled: true
  when: ansible_os_family == "RedHat"

- name: copy index.html
  copy:
    src: index.html
    dest: /var/www/html
    mode: 0666

